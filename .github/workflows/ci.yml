name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RELAY_FLOCI_ENDPOINT_URL: http://127.0.0.1:4566
      RELAY_FLOCI_REQUIRED: "true"
    services:
      floci:
        image: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
        ports:
          - 4566:4566
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run behavior and Floci integration tests
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit .

      - name: Build Lambda package
        run: python scripts/package_lambda.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/terraform validate -no-color

      - name: Create an offline Terraform plan
        env:
          CHECKPOINT_DISABLE: "1"
          TF_IN_AUTOMATION: "1"
        run: >-
          terraform -chdir=infra/terraform plan
          -input=false
          -no-color
          -refresh=false
          -var-file=terraform.tfvars.example

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
