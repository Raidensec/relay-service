services:
  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      RELAY_DATABASE: /var/lib/relay/relay.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - relay-data:/var/lib/relay
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

  worker:
    build: .
    command: ["worker"]
    env_file: .env
    environment:
      RELAY_DATABASE: /var/lib/relay/relay.sqlite3
    volumes:
      - relay-data:/var/lib/relay
    depends_on:
      api:
        condition: service_healthy

volumes:
  relay-data:
