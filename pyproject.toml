[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-service"
version = "0.1.0"
description = "Durable authenticated webhook delivery with local SQLite and AWS backends"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3==1.43.114"]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[project.scripts]
relay-service = "relay_service.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
